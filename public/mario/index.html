<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5c94fc">
  <title>سوپر ماریو</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: #10131f;
      color: #e2e8f0;
      font-family: system-ui, "Vazirmatn", Tahoma, sans-serif;
      display: flex; justify-content: center;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    #wrap {
      width: 100%; max-width: 430px; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    #hud {
      width: 100%; max-width: 420px;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 2px;
    }
    .pill {
      background: #141b31; border: 1px solid #2b3a5e;
      border-radius: 999px; padding: 6px 10px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    .spacer { flex: 1; }
    .iconbtn {
      font-family: inherit; font-size: 16px;
      width: 38px; height: 38px;
      border: 1px solid #2b3a5e; border-radius: 12px;
      background: #141b31; color: #e2e8f0; cursor: pointer;
    }
    .iconbtn:active { background: #e11d48; color: #fff; }
    #stage { position: relative; width: 100%; max-width: 420px; }
    #canvas {
      width: 100%; aspect-ratio: 420 / 704;
      display: block; border-radius: 14px;
      background: #5c94fc;
      border: 1px solid #1e2a4a;
      touch-action: none;
    }
    #card {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(4, 7, 16, 0.78);
      border-radius: 14px; z-index: 5;
    }
    #card.show { display: flex; }
    #cardInner {
      background: #101828;
      border: 1px solid #2b3a5e;
      border-radius: 16px;
      padding: 24px 22px; margin: 16px;
      text-align: center; max-width: 330px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    #cardTitle { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    #cardText { font-size: 15px; line-height: 2; color: #cbd5e1; }
    #cardButtons { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    #cardButtons button {
      font-family: inherit; font-size: 15px; font-weight: 700;
      border: none; border-radius: 12px; padding: 10px 22px;
      background: #e11d48; color: #fff; cursor: pointer;
    }
    #cardButtons button:active { transform: scale(.96); }
    #cardButtons button.ghost { background: #1e293b; color: #e2e8f0; }
    #pad {
      width: 100%; max-width: 420px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 6px 0; direction: ltr;
    }
    .pgroup { display: flex; gap: 10px; }
    .pbtn {
      font-family: inherit; font-weight: 800; color: #fff;
      border: none; border-radius: 50%;
      width: 64px; height: 64px; font-size: 22px;
      background: radial-gradient(circle at 35% 30%, #6b7280, #374151 70%);
      box-shadow: 0 4px 0 #1f2937, 0 6px 12px rgba(0,0,0,.4);
      touch-action: none; cursor: pointer;
    }
    .pbtn:active, .pbtn.held {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1f2937;
    }
    .pbtn.jump {
      width: 76px; height: 76px; font-size: 26px;
      background: radial-gradient(circle at 35% 30%, #f87171, #b91c1c 70%);
      box-shadow: 0 4px 0 #7f1d1d, 0 6px 12px rgba(0,0,0,.4);
    }
    .pbtn.jump:active, .pbtn.jump.held { box-shadow: 0 1px 0 #7f1d1d; }
    .pbtn.run {
      background: radial-gradient(circle at 35% 30%, #fbbf24, #b45309 70%);
      box-shadow: 0 4px 0 #78350f, 0 6px 12px rgba(0,0,0,.4);
    }
    .pbtn.run:active, .pbtn.run.held { box-shadow: 0 1px 0 #78350f; }
    #hint {
      width: 100%; max-width: 420px;
      text-align: center; font-size: 12px; color: #64748b;
      line-height: 1.9; padding-top: 2px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <div class="pill">🎯 <span id="score">۰</span></div>
      <div class="pill">🪙 <span id="coins">۰</span></div>
      <div class="pill">❤️ <span id="lives">۳</span></div>
      <div class="pill">⏱ <span id="time">۳۰۰</span></div>
      <div class="spacer"></div>
      <button id="muteBtn" class="iconbtn" title="صدا">🔊</button>
      <button id="pauseBtn" class="iconbtn" title="توقف">⏸</button>
    </div>
    <div id="stage">
      <canvas id="canvas" width="420" height="704"></canvas>
      <div id="card">
        <div id="cardInner">
          <div id="cardTitle"></div>
          <div id="cardText"></div>
          <div id="cardButtons"></div>
        </div>
      </div>
    </div>
    <div id="pad" dir="ltr">
      <div class="pgroup">
        <button id="leftBtn" class="pbtn">◀</button>
        <button id="rightBtn" class="pbtn">▶</button>
      </div>
      <div class="pgroup">
        <button id="runBtn" class="pbtn run">B</button>
        <button id="jumpBtn" class="pbtn jump">A</button>
      </div>
    </div>
    <div id="hint">A پرش (نگه دار بلندتر می‌پرد) · B دویدن · روی کامپیوتر: جهت‌ها + Space</div>
  </div>
  <script src="https://telegram.org/js/games.js"></script>
  <script src="/mario/game.js?v=1"></script>
</body>
</html>
