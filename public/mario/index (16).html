<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>سوپر ماریو</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 700px at 50% -10%, #1b2440, #0b1020 70%);
      color: #e2e8f0;
      font-family: system-ui, "Vazirmatn", Tahoma, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
    #stage { position: relative; width: 100%; max-width: min(100%, calc((100vh - 16px) * 800 / 448)); }
    #canvas {
      width: 100%; aspect-ratio: 800 / 448;
      display: block; border-radius: 14px;
      background: #5c94fc;
      border: 1px solid #1e2a4a;
      box-shadow: 0 18px 50px rgba(0,0,0,.5);
      touch-action: none;
    }
    #hud {
      position: absolute; top: 8px; left: 10px; right: 10px;
      display: flex; align-items: center; gap: 6px;
      z-index: 4; pointer-events: none;
    }
    .pill {
      background: rgba(10,15,30,.62);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px; padding: 5px 11px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    .spacer { flex: 1; }
    .iconbtn {
      pointer-events: auto;
      font-family: inherit; font-size: 15px;
      width: 34px; height: 34px;
      border: 1px solid rgba(255,255,255,.16); border-radius: 10px;
      background: rgba(10,15,30,.62); color: #e2e8f0; cursor: pointer;
    }
    .iconbtn:active { background: #e11d48; color: #fff; }
    #pad {
      position: absolute; left: 0; right: 0; bottom: 10px;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 12px; z-index: 4; direction: ltr;
    }
    .pgroup { display: flex; gap: 10px; align-items: flex-end; }
    .pbtn {
      font-family: inherit; font-weight: 800; color: #fff;
      border: none; border-radius: 50%;
      width: 62px; height: 62px; font-size: 20px;
      background: radial-gradient(circle at 35% 30%, rgba(120,130,150,.92), rgba(55,65,81,.92) 70%);
      box-shadow: 0 4px 0 rgba(20,25,35,.9), 0 6px 14px rgba(0,0,0,.45);
      opacity: .88; touch-action: none; cursor: pointer;
    }
    .pbtn:active, .pbtn.held {
      transform: translateY(3px); opacity: 1;
      box-shadow: 0 1px 0 rgba(20,25,35,.9);
    }
    .pbtn.jump {
      width: 74px; height: 74px; font-size: 24px;
      background: radial-gradient(circle at 35% 30%, rgba(248,113,113,.94), rgba(185,28,28,.94) 70%);
      box-shadow: 0 4px 0 rgba(127,29,29,.9), 0 6px 14px rgba(0,0,0,.45);
    }
    .pbtn.jump:active, .pbtn.jump.held { box-shadow: 0 1px 0 rgba(127,29,29,.9); }
    .pbtn.run {
      background: radial-gradient(circle at 35% 30%, rgba(251,191,36,.94), rgba(180,83,9,.94) 70%);
      box-shadow: 0 4px 0 rgba(120,53,15,.9), 0 6px 14px rgba(0,0,0,.45);
    }
    .pbtn.run:active, .pbtn.run.held { box-shadow: 0 1px 0 rgba(120,53,15,.9); }
    #card {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(4, 7, 16, 0.72);
      border-radius: 14px; z-index: 6;
    }
    #card.show { display: flex; }
    #cardInner {
      background: #101828;
      border: 1px solid #2b3a5e;
      border-radius: 16px;
      padding: 20px; margin: 14px;
      text-align: center; max-width: 340px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    #cardTitle { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    #cardText { font-size: 14px; line-height: 2; color: #cbd5e1; }
    #cardButtons { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    #cardButtons button {
      font-family: inherit; font-size: 14px; font-weight: 700;
      border: none; border-radius: 12px; padding: 9px 20px;
      background: #e11d48; color: #fff; cursor: pointer;
    }
    #cardButtons button:active { transform: scale(.96); }
    #cardButtons button.ghost { background: #1e293b; color: #e2e8f0; }
    #rotatePrompt {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: #0b1020; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    #rotatePrompt .box { font-size: 19px; line-height: 2.4; }
    #rotatePrompt .phone { font-size: 54px; display: inline-block; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
    @media (orientation: portrait) { #rotatePrompt { display: flex; } }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="canvas" width="800" height="448"></canvas>
      <div id="hud">
        <div class="pill">🎯 <span id="score">۰</span></div>
        <div class="pill">🪙 <span id="coins">۰</span></div>
        <div class="pill">❤️ <span id="lives">۳</span></div>
        <div class="pill">⏱ <span id="time">۳۰۰</span></div>
        <div class="spacer"></div>
        <button id="muteBtn" class="iconbtn" title="صدا">🔊</button>
        <button id="pauseBtn" class="iconbtn" title="توقف">⏸</button>
      </div>
      <div id="pad" dir="ltr">
        <div class="pgroup">
          <button id="leftBtn" class="pbtn">◀</button>
          <button id="rightBtn" class="pbtn">▶</button>
        </div>
        <div class="pgroup">
          <button id="runBtn" class="pbtn run">B</button>
          <button id="jumpBtn" class="pbtn jump">A</button>
        </div>
      </div>
      <div id="card">
        <div id="cardInner">
          <div id="cardTitle"></div>
          <div id="cardText"></div>
          <div id="cardButtons"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="rotatePrompt">
    <div class="box">
      <span class="phone">📱</span><br>
      برای بازی گوشی را بچرخانید<br>
      <small style="opacity:.6">این بازی به‌صورت افقی طراحی شده</small>
    </div>
  </div>
  <script src="https://telegram.org/js/games.js"></script>
  <script src="/mario/game.js?v=3"></script>
</body>
</html>
