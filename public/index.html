<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <meta name="theme-color" content="#0e1424">

  <title>Ninja Fruit</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

      <div class="pill">
        <span class="label">SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="pill combo-pill">
        <span id="comboText">COMBO</span>
        <strong id="combo">x0</strong>
      </div>

      <div class="pill">
        <span class="label">BEST</span>
        <strong id="best">0</strong>
      </div>

    </div>

    <div id="lives" aria-label="lives">
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
    </div>

    <div id="message" class="hidden">

      <div class="card">

        <div class="logo">🥷</div>

        <h1>NINJA FRUIT</h1>

        <p id="messageText">
          Slice fruit. Avoid bombs.
        </p>

        <button id="startButton">
          START
        </button>

      </div>

    </div>

    <div id="pause" class="hidden">

      <button id="resumeButton">
        RESUME
      </button>

    </div>

    <button
      id="pauseButton"
      aria-label="Pause"
    >
      Ⅱ
    </button>

  </main>


  <!-- Telegram HTML5 Games API -->
  <script src="https://telegram.org/js/games.js"></script>

  <!-- Ninja Fruit Game -->
  <script src="/game.js"></script>

</body>
</html>
