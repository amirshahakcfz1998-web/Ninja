<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>ماشین‌سواری</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #0b1020;
      color: #e2e8f0;
      font-family: system-ui, Tahoma, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #game {
      width: 100%;
      max-width: 480px;
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #hud { width: 100%; display: flex; gap: 8px; }
    .pill {
      flex: 1;
      background: #16213a;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
    }
    .pill .label { display: block; font-size: 10px; color: #94a3b8; }
    .pill strong { font-size: 20px; line-height: 1.3; }
    #pauseButton, #muteButton {
      width: 52px;
      border: none;
      border-radius: 12px;
      background: #16213a;
      color: #e2e8f0;
      font-size: 20px;
      cursor: pointer;
    }
    #pauseButton:active, #muteButton:active { background: #243356; }
    #pauseButton.hidden { display: none; }
    #wrap { position: relative; width: 100%; max-width: 400px; }
    #canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background: #0b1020;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5,8,18,.72);
      border-radius: 12px;
      backdrop-filter: blur(2px);
      z-index: 5;
    }
    #message.hidden { display: none; }
    #card {
      background: #16213a;
      border: 1px solid #2b3b63;
      border-radius: 16px;
      padding: 22px 20px;
      margin: 16px;
      text-align: center;
      max-width: 330px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    #card h2 { margin: 0 0 10px; font-size: 22px; }
    #messageText { font-size: 15px; line-height: 2; color: #cbd5e1; }
    #messageText small { font-size: 11px; }
    #cardButtons { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    #cardButtons button {
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #e11d48;
      color: #fff;
      cursor: pointer;
    }
    #cardButtons button:active { background: #be123c; }
    #cardButtons button.secondary { background: #2b3b63; }
    #cardButtons button.secondary:active { background: #3b4f7d; }
    #hint {
      width: 100%;
      max-width: 400px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="pill"><span class="label">امتیاز</span><strong id="score">۰</strong></div>
      <div class="pill"><span class="label">لول</span><strong id="level">۱</strong></div>
      <div class="pill"><span class="label">سرعت</span><strong id="speed">۰</strong></div>
      <button id="muteButton" title="صدا">🔊</button>
      <button id="pauseButton" class="hidden" title="مکث">⏸</button>
    </div>
    <div id="wrap">
      <canvas id="canvas" width="420" height="720"></canvas>
      <div id="message" class="hidden">
        <div id="card">
          <h2 id="messageTitle"></h2>
          <div id="messageText"></div>
          <div id="cardButtons"></div>
        </div>
      </div>
    </div>
    <div id="hint">📱 گوشی را به چپ و راست کج کن تا لاین عوض شود<br>روی دسکتاپ: ← → یا درگ با موس</div>
  </div>
  <script src="https://telegram.org/js/games.js"></script>
  <script src="/drive/game.js?v=1"></script>
</body>
</html>
