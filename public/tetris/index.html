<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>تتریس</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, Tahoma, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #game {
      width: 100%;
      max-width: 480px;
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #hud { width: 100%; display: flex; gap: 8px; }
    .pill {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
    }
    .pill .label { display: block; font-size: 10px; color: #94a3b8; }
    .pill strong { font-size: 20px; line-height: 1.3; }
    #pauseButton {
      width: 52px;
      border: none;
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 20px;
      cursor: pointer;
    }
    #pauseButton:active { background: #334155; }
    #pauseButton.hidden { display: none; }
    #muteButton {
      width: 52px;
      border: none;
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 20px;
      cursor: pointer;
    }
    #muteButton:active { background: #334155; }
    #canvas {
      width: 100%;
      max-width: 390px;
      height: auto;
      border-radius: 12px;
      background: #0b1220;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    #controls { width: 100%; max-width: 390px; display: flex; gap: 8px; direction: ltr; }
    #controls button {
      flex: 1;
      font-size: 22px;
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
      touch-action: none;
    }
    #controls button:active { background: #334155; transform: scale(.96); }
    #message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,.72);
      z-index: 10;
      padding: 20px;
    }
    #message.hidden { display: none; }
    .card {
      background: #fff;
      color: #0f172a;
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .card .logo { font-size: 52px; line-height: 1; }
    .card h1 { margin: 10px 0 6px; font-size: 30px; }
    .card p { margin: 0 0 18px; color: #334155; line-height: 1.9; }
    .card small { word-break: break-all; }
    #startButton {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: #fbbf24;
      color: #0f172a;
      cursor: pointer;
    }
    #startButton:active { transform: scale(.97); }
    #pauseActions { display: flex; gap: 8px; margin-top: 10px; }
    #pauseActions.hidden { display: none; }
    #pauseActions button {
      flex: 1;
      padding: 12px 6px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: #e2e8f0;
      color: #0f172a;
      cursor: pointer;
    }
    #pauseActions button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main id="game">
    <div id="hud">
      <div class="pill"><span class="label">امتیاز</span><strong id="score">0</strong></div>
      <div class="pill"><span class="label">رکورد</span><strong id="best">0</strong></div>
      <div class="pill"><span class="label">مرحله</span><strong id="level">1</strong></div>
      <button id="pauseButton" class="hidden" aria-label="مکث">⏸</button>
      <button id="muteButton" aria-label="صدا">🔊</button>
    </div>

    <canvas id="canvas"></canvas>

    <div id="controls">
      <button data-act="left" aria-label="چپ">◀</button>
      <button data-act="right" aria-label="راست">▶</button>
      <button data-act="rotate" aria-label="چرخش">⟳</button>
      <button data-act="down" aria-label="پایین">▼</button>
      <button data-act="drop" aria-label="سقوط">⤓</button>
    </div>

    <div id="message">
      <div class="card">
        <div class="logo">🧱</div>
        <h1 id="messageTitle">تتریس</h1>
        <p id="messageText"></p>
        <button id="startButton">شروع</button>
        <div id="pauseActions" class="hidden">
          <button id="restartButton">🔄 شروع مجدد</button>
          <button id="quitButton">🏁 پایان بازی</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://telegram.org/js/games.js"></script>
  <script src="/tetris/game.js?v=3"></script>
</body>
</html>
